name: Robô Caixa (iComanda → Supabase)

on:
  # Três janelas pelo mesmo motivo do Robô PDV: o `schedule` do GitHub é
  # best-effort e pulou as duas janelas de 31/08/2026 nos dois robôs, calado.
  # Idempotente e com janela retroativa, então tentativa a mais não custa nada.
  schedule:
    - cron: '40 12 * * *'   # 08:40 Manaus — dia anterior já fechado
    - cron: '40 15 * * *'   # 11:40 Manaus — segunda tentativa
    - cron: '40 21 * * *'   # 17:40 Manaus — rede, bem longe das outras duas
  workflow_dispatch:         # botão "Run workflow"
    inputs:
      dias_back:
        description: 'Quantos dias para trás refazer (vazio = 4). Use 30 para refazer o mês.'
        required: false
        default: ''

concurrency:
  group: pull-caixa
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Puxar conferência e movimentos de caixa (iComanda) → Supabase
        env:
          ICOMANDA_API_URL: ${{ secrets.ICOMANDA_API_URL }}
          ICOMANDA_API_KEY: ${{ secrets.ICOMANDA_API_KEY }}
          ICOMANDA_CAIXA_START_DATE: ${{ secrets.ICOMANDA_CAIXA_START_DATE }}
          ICOMANDA_DAYS_BACK: ${{ github.event.inputs.dias_back }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/pull_caixa.py
