name: Robô PDV (iComanda → Supabase)

on:
  # Três janelas porque o `schedule` do GitHub é best-effort: ele atrasa e às
  # vezes PULA execuções sob carga, sem falha vermelha para ninguém ver. Em
  # 31/08/2026 as duas janelas do dia não dispararam (nem aqui nem no Robô
  # Caixa) e o financeiro ficou sem o PDV desde a tarde anterior — 490
  # pagamentos parados, achados por scripts/checar_caixas.py no outro repo.
  # Como o robô é idempotente e revisita 4 dias, sobrar tentativa não custa
  # nada: a que pegar primeiro grava, as outras não duplicam.
  schedule:
    - cron: '30 12 * * *'   # 08:30 Manaus — dia anterior já fechado
    - cron: '30 15 * * *'   # 11:30 Manaus — segunda tentativa (pega caixas fechados tarde)
    - cron: '30 21 * * *'   # 17:30 Manaus — rede, bem longe das outras duas
  workflow_dispatch: {}      # botão "Run workflow" para rodar na hora

# Evita duas execuções simultâneas
concurrency:
  group: pull-pdv
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Puxar pagamentos do PDV (iComanda) e gravar no Supabase
        env:
          ICOMANDA_API_URL: ${{ secrets.ICOMANDA_API_URL }}
          ICOMANDA_API_KEY: ${{ secrets.ICOMANDA_API_KEY }}
          ICOMANDA_START_DATE: ${{ secrets.ICOMANDA_START_DATE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/pull_pdv.py
